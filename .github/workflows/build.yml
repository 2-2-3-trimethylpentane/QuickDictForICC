name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout plugin
      uses: actions/checkout@v6.0.2
      with:
        path: QuickDictForICC

    - name: Checkout SDK
      uses: actions/checkout@v6.0.2
      with:
        repository: InkCanvasForClass/community
        path: community

    - name: Setup .NET
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore QuickDictForICC/QuickDictForICC.csproj

    - name: Build
      run: dotnet build QuickDictForICC/QuickDictForICC.csproj --configuration Release --no-restore

    - name: Upload artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: QuickDictForICC
        path: QuickDictForICC/bin/Release/net6.0-windows10.0.19041.0/