name: Build

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE' ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Publish plugin
        shell: pwsh
        run: dotnet publish QuickDictForICC.csproj -c Release --self-contained false

      - name: Package .icpx
        id: package
        shell: pwsh
        run: |
          ./pack.ps1
          $hash = (Get-FileHash packages/quickdict.plugin.icpx -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickdict.plugin
          path: packages/quickdict.plugin.icpx
